<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d6b32">
    <title>Tiket Masuk | Bagas Bagus</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚽</text></svg>">
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="main.css">
</head>
<body>

    <svg class="sprite" width="0" height="0" aria-hidden="true" focusable="false">
        <defs><clipPath id="ballclip"><circle cx="50" cy="50" r="47"/></clipPath></defs>
        <symbol id="ball" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="47" fill="#fff" stroke="#0b2a17" stroke-width="4"/>
            <g clip-path="url(#ballclip)" fill="#0b2a17">
                <polygon points="50,33 66,45 60,64 40,64 34,45"/>
                <circle cx="50" cy="0" r="13"/><circle cx="97.5" cy="34.5" r="13"/>
                <circle cx="79.4" cy="90.5" r="13"/><circle cx="20.6" cy="90.5" r="13"/>
                <circle cx="2.5" cy="34.5" r="13"/>
            </g>
            <g stroke="#0b2a17" stroke-width="3" stroke-linecap="round">
                <line x1="50" y1="33" x2="50" y2="12"/><line x1="66" y1="45" x2="86" y2="38"/>
                <line x1="60" y1="64" x2="72" y2="81"/><line x1="40" y1="64" x2="28" y2="81"/>
                <line x1="34" y1="45" x2="14" y2="38"/>
            </g>
        </symbol>
    </svg>

    <!-- bola-bola yang melayang di latar -->
    <div class="floaters" aria-hidden="true">
        <svg style="--x:6%;  --s:54px; --t:7s;  --d:0s"><use href="#ball"/></svg>
        <svg style="--x:22%; --s:34px; --t:9s;  --d:-3s"><use href="#ball"/></svg>
        <svg style="--x:44%; --s:46px; --t:8s;  --d:-5s"><use href="#ball"/></svg>
        <svg style="--x:68%; --s:30px; --t:10s; --d:-1s"><use href="#ball"/></svg>
        <svg style="--x:82%; --s:58px; --t:7.5s;--d:-4s"><use href="#ball"/></svg>
        <svg style="--x:94%; --s:36px; --t:9.5s;--d:-6s"><use href="#ball"/></svg>
    </div>

    <main class="gate">
        <article class="ticket" id="ticket">

            <div class="ticket-main">
                <p class="ticket-kind">Tiket masuk portofolio</p>
                <h1>Bagas Bagus</h1>
                <p class="role">Saya adalah seorang siswa SMP</p>

                <dl class="info">
                    <div><dt>Email</dt><dd class="email">bagas@gmail.com</dd></div>
                    <div><dt>Kota</dt><dd>Bogor</dd></div>
                    <div><dt>Telepon</dt><dd class="nomor_telpon">08218348123</dd></div>
                </dl>

                <p class="text">Selamat datang di stadion portofolio saya. Tunjukkan tiket ini di pintu masuk, lalu kenalan, lihat skill, dan coba cetak gol!</p>

                <div class="actions">
                    <a class="btn btn-yellow kontak" id="enter" href="page2.html">Masuk stadion</a>
                    <a class="btn btn-chalk" href="https://www.youtube.com/" target="_blank" rel="noopener">Link Sosmed</a>
                </div>
            </div>

            <div class="ticket-stub">
                <img class="gambar" src="kelinci.jpg" alt="Maskot tim: anak kelinci berbulu kuning" width="1500" height="1500">
                <p class="mascot">Maskot tim</p>
                <div class="barcode" aria-hidden="true"></div>
            </div>

        </article>
    </main>

    <script src="main.js"></script>
</body>
</html>
